name: Crear APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Extraer proyecto
        run: |
          mkdir proyecto
          unzip -q MiNegocioProFinal.zip -d proyecto

      - name: Preparar proyecto
        run: |
          cp -r proyecto/app .
          cp proyecto/build.gradle.kts .
          cp proyecto/settings.gradle.kts .
          cp proyecto/gradle.properties . 2>/dev/null || true

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Crear APK
        run: gradle assembleDebug --no-daemon

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: MiNegocioPro-APK
          path: app/build/outputs/apk/debug/*.apk
